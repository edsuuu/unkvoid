[package]
name = "unkvoid-windows"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "unkvoid"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Sem ponte: o núcleo entra como crate, e o que ele decide chega tipado.
core-app = { path = "../../shared/core" }
storage = { path = "../../shared/storage" }
slint = "1.18"

# A lista de microfones e de saídas de áudio do sistema.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    # O `PROPVARIANT` e o `VT_LPWSTR` do nome do aparelho.
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }

[build-dependencies]
slint-build = "1.18"
