[package]
name = "unkvoid-windows"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "unkvoid"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Sem ponte: o núcleo entra como crate, e o que ele decide chega tipado.
core-app = { path = "../../shared/core" }
storage = { path = "../../shared/storage" }
# A captura e o encoder: a transmissão é a mesma do `core_app::sharing`, que já os usa.
capture = { path = "../../shared/capture" }
media = { path = "../../shared/media" }
serde.workspace = true
serde_json.workspace = true
# A chave SRTP atravessa o `producePlain` em base64, e volta assim do servidor.
base64 = "0.22"
slint = "1.18"
# A prévia do seletor de tela chega em JPEG do `capture`. Já está no lock pelo próprio Slint.
image = { version = "0.25", default-features = false, features = ["jpeg"] }

# A lista de microfones e de saídas de áudio do sistema.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    # O `PROPVARIANT` e o `VT_LPWSTR` do nome do aparelho.
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    # O `ShellExecuteW` que abre o instalador da atualização pedindo o administrador.
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.18"
# O ícone do .exe. Já está no lock pelo Tauri, e não faz nada fora do Windows.
tauri-winres = "0.3"
