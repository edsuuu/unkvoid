[package]
name = "unkvoid-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Unkvoid: compartilhar a tela sem perder fps"

[lib]
name = "unkvoid_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
base64 = "0.22"
rand = "0.8"
capture = { path = "../../../crates/capture" }
media = { path = "../../../crates/media" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = "2.4.4"
tauri-plugin-updater = "2.11.0"

tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# O WebKitGTK entrega WebRTC desligado. Sem mexer nesta configuração, a janela do app no
# Linux não tem `RTCPeerConnection` e o mediasoup morre antes de entrar na sala.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_38"] }
