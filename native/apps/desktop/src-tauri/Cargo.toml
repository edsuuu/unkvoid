[package]
name = "unkvoid-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Unkvoid: compartilhar a tela sem perder fps"

[lib]
name = "unkvoid_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
base64 = "0.22"
rand = "0.8"
capture = { path = "../../../crates/capture" }
media = { path = "../../../crates/media" }
# Mesma versão e mesmas features que o plugin do atualizador já compila: o TLS vem da
# unificação de features do cargo, sem trazer uma segunda pilha de criptografia junto.
# `rustls` traz junto o provedor de criptografia. O plugin do updater liga só a variante
# sem provedor, e aí o `Client::new()` do relatório de erro panica em vez de enviar.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# O `unkvoid://` do retorno do login: registrar esquema exige suporte de cada sistema,
# e o plugin é quem escreve isso no bundle do macOS e no instalador do Windows.
tauri-plugin-deep-link = "2.4.10"
tauri-plugin-process = "2.3.1"
# Com `deep-link`: no Windows e no Linux o `unkvoid://` abre um segundo processo, e só
# assim o endereço chega ao `on_open_url` da janela que já estava aberta.
tauri-plugin-single-instance = { version = "2.4.4", features = ["deep-link"] }
tauri-plugin-updater = "2.11.0"

tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Já vem pelo reqwest; aqui só para ler o `?token=` que o navegador devolve no login.
url = "2"
tauri-plugin-global-shortcut = "2.3.2"

# Os atalhos no Windows perguntam o estado da tecla (`GetAsyncKeyState`) em vez de
# registrar no sistema: o `RegisterHotKey` do plugin engole a tecla do jogo e não conhece
# botão de mouse. A mesma versão que o `capture` já compila.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_UI_Input_KeyboardAndMouse"] }

# O WebKitGTK entrega WebRTC desligado. Sem mexer nesta configuração, a janela do app no
# Linux não tem `RTCPeerConnection` e o mediasoup morre antes de entrar na sala.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_38"] }
