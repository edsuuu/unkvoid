<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Unkvoid</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Update: runs before anything else, as in Discord -->
<section class="tela-cheia" id="tela-update">
  <div class="cartao">
    <h1>Unkvoid</h1>
    <p id="update-status">Looking for updates…</p>
    <div class="aviso"><span class="girando"></span></div>
  </div>
</section>

<!-- Without a server the app is useless: block instead of pretending it works -->
<section class="tela-cheia" id="tela-offline" hidden>
  <div class="cartao">
    <h1>No connection</h1>
    <p>Unkvoid needs the server to work. Reconnecting…</p>
    <div class="aviso"><span class="girando"></span><span id="offline-tentativa"></span></div>
  </div>
</section>

<section class="tela-cheia" id="tela-login" hidden>
  <div class="cartao">
    <h1>Sign in to your account</h1>
    <p>Use the same login as discord.unkvoid.com</p>

    <form id="form-login">
      <div class="campo">
        <label for="email">Email address</label>
        <input id="email" type="email" autocomplete="username" required>
      </div>

      <div class="campo">
        <label for="senha">Password</label>
        <input id="senha" type="password" autocomplete="current-password" required>
      </div>

      <button type="submit" class="botao" id="botao-entrar">Sign in</button>

      <div style="display:flex;align-items:center;gap:12px;margin:20px 0 16px">
        <span style="flex:1;height:1px;background:#3f4147"></span>
        <span style="font-size:12px;color:#949ba4;text-transform:uppercase">or</span>
        <span style="flex:1;height:1px;background:#3f4147"></span>
      </div>

      <button type="button" class="botao neutro" id="botao-google" style="width:100%">
        Continue with Google
      </button>

      <p class="erro" id="erro-login"></p>
    </form>
  </div>
</section>

<nav class="trilha" id="trilha"></nav>

<aside class="canais">
  <header class="cabecalho"><span id="nome-servidor">Home</span></header>

  <div class="lista" id="lista-canais"></div>

  <div class="voz" id="faixa-voz" hidden>
    <div class="voz-topo">
      <span class="avatar" style="background:var(--verde);width:8px;height:8px"></span>
      <div class="voz-titulo">
        Voice connected <span class="voz-canal" id="voz-relogio"></span>
        <div class="voz-canal" id="voz-canal"></div>
      </div>
      <button class="botao neutro" id="mudo" style="flex:0;padding:6px 10px">Mute</button>
      <button class="botao neutro" id="config-mic" style="flex:0;padding:6px 10px" title="Microphone settings">Mic</button>
      <button class="botao neutro" id="sair-voz" style="flex:0;padding:6px 10px">Leave</button>
    </div>

    <div class="acoes">
      <select class="qualidade" id="qualidade">
        <option value="720">720p</option>
        <option value="1080" selected>1080p</option>
        <option value="1440">1440p</option>
      </select>
      <button class="botao" id="compartilhar">Share</button>
      <button class="botao perigo" id="parar" hidden>Stop</button>
    </div>

    <div class="medidor"><span data-medidor></span></div>

    <div class="painel-mic" id="painel-mic" hidden>
      <label class="linha"><input type="radio" name="modo-mic" value="voice"> Voice activity</label>
      <label class="linha"><input type="radio" name="modo-mic" value="ptt"> Push to talk</label>

      <div id="mic-voz">
        <p class="secao">Input sensitivity</p>
        <input type="range" id="mic-limiar" min="-100" max="0" step="1">
      </div>

      <div id="mic-tecla" hidden>
        <p class="secao">Key</p>
        <button class="botao neutro" id="mic-atalho"></button>
      </div>

      <label class="linha"><input type="checkbox" id="mic-ruido"> Noise suppression</label>
    </div>
  </div>

  <div class="usuario">
    <span class="avatar grande" id="meu-avatar"></span>
    <div style="flex:1;min-width:0">
      <div class="nome" id="meu-nome"></div>
      <div class="estado" id="meu-estado">Available</div>
    </div>
  </div>
</aside>

<main class="conteudo">
  <header class="cabecalho"><span id="titulo-canal">Select a channel</span></header>
  <div class="palco" id="palco" hidden></div>
  <div class="vazio" id="vazio">Choose a server to get started</div>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
