<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Discord 2.0</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    background: #151619; color: #dbdee1;
    font: 15px/1.5 ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 20px; border-bottom: 1px solid #26282c; background: #1e1f22;
  }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; }
  header span { font-size: 12px; color: #949ba4; }
  main { flex: 1; padding: 20px; overflow-y: auto; }
  section { background: #2b2d31; border-radius: 8px; padding: 16px; margin-bottom: 14px; }
  h2 { margin: 0 0 10px; font-size: 12px; font-weight: 700; text-transform: uppercase;
       letter-spacing: .04em; color: #949ba4; }
  button {
    padding: 9px 16px; border: 0; border-radius: 6px; background: #5865f2;
    color: #fff; font: 500 14px/1 inherit; cursor: pointer;
  }
  button:hover:not(:disabled) { background: #4752c4; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.parar { background: #da373c; }
  select { padding: 8px 10px; border: 0; border-radius: 6px; background: #1e1f22;
           color: #dbdee1; font: inherit; cursor: pointer; }
  ul { margin: 0; padding: 0; list-style: none; }
  li { padding: 8px 10px; border-radius: 6px; font-size: 14px; }
  li:nth-child(odd) { background: #313338; }
  .linha { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .stats { margin-top: 12px; font: 12px/1.6 ui-monospace, Menlo, monospace; color: #949ba4; }
  .erro { color: #f23f43; font-size: 13px; margin-top: 10px; }
</style>
</head>
<body>

<header>
  <h1>Discord 2.0</h1>
  <span id="plataforma"></span>
</header>

<main>
  <section>
    <h2>Compartilhar tela</h2>
    <div class="linha">
      <select id="qualidade">
        <option value="720">720p</option>
        <option value="1080" selected>1080p</option>
        <option value="1440">1440p</option>
      </select>
      <button id="iniciar">Iniciar captura</button>
      <button id="parar" class="parar" disabled>Parar</button>
    </div>
    <div class="stats" id="stats"></div>
    <p class="erro" id="erro"></p>
  </section>

  <section>
    <h2>Telas detectadas</h2>
    <ul id="telas"><li>carregando…</li></ul>
  </section>
</main>

<script type="module">
const { invoke } = window.__TAURI__.core;
const { listen } = window.__TAURI__.event;

const elemento = id => document.getElementById(id);
const erro = texto => { elemento('erro').textContent = texto ?? ''; };

let quadros = 0;
let ultimoTamanho = '';
let cronometro = null;

const carregarTelas = async () => {
    try {
        const telas = await invoke('list_displays');

        elemento('telas').innerHTML = telas.length
            ? telas.map(tela => `<li>#${tela.id} — ${tela.width}×${tela.height}</li>`).join('')
            : '<li>nenhuma tela listada (no Linux quem escolhe é o portal do sistema)</li>';
    } catch (falha) {
        elemento('telas').innerHTML = '<li>não foi possível listar</li>';
        erro(String(falha));
    }
};

listen('capture:frame', evento => {
    quadros += 1;
    ultimoTamanho = `${evento.payload[0]}×${evento.payload[1]}`;
});

elemento('iniciar').onclick = async () => {
    erro('');
    quadros = 0;

    try {
        await invoke('start_capture', { quality: elemento('qualidade').value });
    } catch (falha) {
        erro(String(falha));

        return;
    }

    elemento('iniciar').disabled = true;
    elemento('parar').disabled = false;

    let anterior = 0;

    cronometro = setInterval(() => {
        elemento('stats').textContent = `${ultimoTamanho} · ${quadros - anterior} fps · ${quadros} quadros`;
        anterior = quadros;
    }, 1000);
};

elemento('parar').onclick = async () => {
    clearInterval(cronometro);
    await invoke('stop_capture').catch(falha => erro(String(falha)));
    elemento('iniciar').disabled = false;
    elemento('parar').disabled = true;
};

elemento('plataforma').textContent = navigator.userAgent.includes('Windows') ? 'Windows'
    : navigator.userAgent.includes('Mac') ? 'macOS' : 'Linux';

carregarTelas();
</script>
</body>
</html>
