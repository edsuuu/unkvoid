<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Discord 2.0</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Atualização: roda antes de qualquer coisa, como no Discord -->
<section class="tela-cheia" id="tela-update">
  <div class="cartao">
    <h1>Discord 2.0</h1>
    <p id="update-status">Procurando atualizações…</p>
    <div class="aviso"><span class="girando"></span></div>
  </div>
</section>

<!-- Sem servidor o app não serve para nada: bloqueia em vez de fingir que funciona -->
<section class="tela-cheia" id="tela-offline" hidden>
  <div class="cartao">
    <h1>Sem conexão</h1>
    <p>O Discord 2.0 precisa do servidor para funcionar. Reconectando…</p>
    <div class="aviso"><span class="girando"></span><span id="offline-tentativa"></span></div>
  </div>
</section>

<section class="tela-cheia" id="tela-login" hidden>
  <div class="cartao">
    <h1>Entrar na sua conta</h1>
    <p>Use o mesmo login do discord.unkvoid.com</p>

    <form id="form-login">
      <div class="campo">
        <label for="email">Endereço de e-mail</label>
        <input id="email" type="email" autocomplete="username" required>
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <input id="senha" type="password" autocomplete="current-password" required>
      </div>

      <button type="submit" class="botao" id="botao-entrar">Entrar</button>
      <p class="erro" id="erro-login"></p>
    </form>
  </div>
</section>

<nav class="trilha" id="trilha"></nav>

<aside class="canais">
  <header class="cabecalho"><span id="nome-servidor">Início</span></header>

  <div class="lista" id="lista-canais"></div>

  <div class="voz" id="faixa-voz" hidden>
    <div class="voz-topo">
      <span class="avatar" style="background:var(--verde);width:8px;height:8px"></span>
      <div class="voz-titulo">
        Voz conectada <span class="voz-canal" id="voz-relogio"></span>
        <div class="voz-canal" id="voz-canal"></div>
      </div>
      <button class="botao neutro" id="sair-voz" style="flex:0;padding:6px 10px">Sair</button>
    </div>

    <div class="acoes">
      <select class="qualidade" id="qualidade">
        <option value="720">720p</option>
        <option value="1080" selected>1080p</option>
        <option value="1440">1440p</option>
      </select>
      <button class="botao" id="compartilhar">Compartilhar</button>
      <button class="botao perigo" id="parar" hidden>Parar</button>
    </div>
  </div>

  <div class="usuario">
    <span class="avatar grande" id="meu-avatar"></span>
    <div style="flex:1;min-width:0">
      <div class="nome" id="meu-nome"></div>
      <div class="estado" id="meu-estado">Disponível</div>
    </div>
  </div>
</aside>

<main class="conteudo">
  <header class="cabecalho"><span id="titulo-canal">Selecione um canal</span></header>
  <div class="palco" id="palco" hidden></div>
  <div class="vazio" id="vazio">Escolha um servidor para começar</div>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
