<!doctype html>
<!--
  Abre o build pronto (dist/) num navegador comum, com a ponte do Tauri fingida.

  Para desenvolver, `npm run dev` já faz isso contra a pilha local (ui/dev/DevTauriBridge.ts).
  Este arquivo serve para olhar um build numa máquina que não compila o Rust:

  npm run build && python3 -m http.server 4599   (nesta pasta) e abra /harness.html
-->
<html lang="pt-BR"><head><meta charset="utf-8"><title>Unkvoid — harness</title></head>
<body>
<div id="root"></div>
<p class="boot-error" id="boot-error" hidden></p>
<script>
window.__TAURI__ = {
    core: {
        invoke: async (command, args) => {
            console.log('invoke', command, args ?? '');

            // Telas e janelas de mentira: no navegador não existe sistema operacional para
            // perguntar, e o que se quer olhar aqui é a interface.
            const answers = {
                check_update: null,
                list_displays: [
                    { id: 1, width: 3456, height: 2234 },
                    { id: 2, width: 1920, height: 1080 },
                ],
                list_windows: [
                    { id: 87, title: 'Arena Breakout', application: 'Steam' },
                    { id: 91, title: 'Terminal', application: 'Terminal' },
                ],
                // 1x1 transparente: prova que a miniatura chega e aparece.
                source_preview: 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7',
                stop_broadcast: 0,
            };

            return command in answers ? answers[command] : null;
        },
    },
    event: { listen: async () => () => null },
};

// Só o `/health` é fingido: o resto das chamadas vai para o servidor configurado.
const realFetch = window.fetch.bind(window);

window.fetch = async (url, options) => (String(url).endsWith('/health') ? new Response('{"ok":true}', { status: 200 }) : realFetch(url, options));
</script>
<script type="module">
const html = await (await fetch('./dist/index.html')).text();
const style = document.createElement('link');

style.rel = 'stylesheet';
style.href = './dist/' + html.match(/href="\/?(assets\/[^"]*\.css)"/)[1];
document.head.appendChild(style);

await import('./dist/' + html.match(/src="\/?(assets\/[^"]*\.js)"/)[1]);
</script>
</body>
</html>
