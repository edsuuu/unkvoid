<!doctype html>
<!--
  Abre a UI do app num navegador comum, com a ponte do Tauri e o servidor fingidos.

  Existe porque a janela do app não tem console acessível: um erro de JavaScript deixa a
  tela preta e não dá pista nenhuma. Aqui o mesmo bundle roda com devtools.

  python3 -m http.server 4599   (nesta pasta) e abra /harness.html
-->
<html lang="pt-BR"><head><meta charset="utf-8"><title>Unkvoid — harness</title></head>
<body>
<script>
window.__TAURI__ = {
    core: {
        invoke: async (comando, args) => {
            console.log('invoke', comando, args ?? '');

            // Telas e janelas de mentira: no navegador não existe sistema operacional
            // para perguntar, e o que se quer testar aqui é o seletor.
            const respostas = {
                check_update: null,
                list_displays: [
                    { id: 1, width: 3456, height: 2234 },
                    { id: 2, width: 1920, height: 1080 },
                ],
                // 1x1 transparente: prova que a miniatura chega e aparece.
                source_preview: 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7',
                list_windows: [
                    { id: 87, title: 'Arena Breakout', application: 'Steam' },
                    { id: 91, title: 'Terminal', application: 'Terminal' },
                    { id: 93, title: 'unkvoid — main', application: 'Code' },
                    { id: 95, title: 'WhatsApp', application: 'WhatsApp' },
                ],
                stop_broadcast: 1234,
                sfu_offer: { ssrc: 7, payloadType: 96 },
            };

            return comando in respostas ? respostas[comando] : null;
        },
    },
    event: { listen: async () => () => {} },
};

// Servidor fingido: só o `/health`, que é tudo o que o app pede por HTTP. O SFU de
// verdade não entra aqui — o que se exercita é a interface.
const fetchReal = window.fetch.bind(window);

window.fetch = async (url, opcoes) => {
    if (String(url).endsWith('/health')) {
        return new Response('{"ok":true}', { status: 200 });
    }

    return fetchReal(url, opcoes);
};
</script>
<script type="module">
const html = await (await fetch('./dist/index.html')).text();

document.body.insertAdjacentHTML('beforeend', html.replace(/[\s\S]*<body[^>]*>/, '').replace(/<\/body>[\s\S]*/, '').replace(/<script[\s\S]*?<\/script>/g, ''));
document.body.className = (html.match(/<body class="([^"]*)"/) ?? [, ''])[1];

const folha = document.createElement('link');
folha.rel = 'stylesheet';
folha.href = './dist/' + html.match(/href="\/?(assets\/[^"]*\.css)"/)[1];
document.head.appendChild(folha);

// Um nome guardado é o estado normal de quem já usou o app uma vez: a tela de entrada
// aparece preenchida, e é assim que ela precisa sair no print.
localStorage.setItem('unkvoid:name', 'Edsu');

await import('./dist/' + html.match(/src="\/?(assets\/[^"]*\.js)"/)[1]);

// `?tela=entrada` e `?tela=sala` existem para tirar print numa máquina que não compila
// o app. Quem pinta a sala é DOM puro; o WebSocket traz gente e vídeo, que numa sala
// recém-criada ainda não existem.
const tela = new URLSearchParams(location.search).get('tela');

if (tela) {
    const limite = Date.now() + 5000;

    while (document.getElementById('entry-screen')?.hidden !== false && Date.now() < limite) {
        await new Promise(volta => setTimeout(volta, 50));
    }

    // Aqui `hidden` não é `display: none`, é opacidade zero com 160 ms de fade, e a
    // captura pegava o meio do caminho: a tela de atualização aparecia por cima da de
    // entrada, meio transparente.
    const semFade = document.createElement('style');

    semFade.textContent = '*, *::before, *::after { transition: none !important; animation: none !important }';
    document.head.appendChild(semFade);
}

if (tela === 'sala' || tela === 'compartilhar') {
    const app = window.unkvoid;

    app.name = 'Edsu';
    app.room = 'k3m9xq2vt7bd';

    // A mesma sequência do `connect()`, menos o SfuClient.
    document.getElementById('entry-screen').hidden = true;
    document.getElementById('room').hidden = false;
    document.getElementById('copy-code').textContent = app.room;
    document.getElementById('empty-code').textContent = app.room;
    app.paintLayout();
    app.wireRoom();
    app.refreshPeople();
}

// A tela mais cheia do app, e a que o harness já sabia montar sozinho: as telas e as
// janelas são de mentira, o resto é o modal de verdade.
if (tela === 'compartilhar') {
    document.getElementById('share').click();

    await new Promise(volta => setTimeout(volta, 400));
}
</script>
</body>
</html>
