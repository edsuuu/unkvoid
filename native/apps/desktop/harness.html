<!doctype html>
<!--
  Abre a UI do app num navegador comum, com a ponte do Tauri fingida.

  Existe porque a janela do app não tem console acessível: um erro de JavaScript deixa a
  tela preta e não dá pista nenhuma. Aqui o mesmo bundle roda com devtools — foi assim
  que apareceu um `this.update is not a function` que a tela preta escondia.

  python3 -m http.server 4599   (nesta pasta) e abra /harness.html
-->
<html lang="pt-BR"><head><meta charset="utf-8"><title>Unkvoid — harness</title></head>
<body>
<script>
// Aponta para a pilha local e já entra logado: o objetivo é exercitar a interface,
// não repetir o login a cada recarga.
// O token NÃO fica aqui. Este arquivo é versionado, e um Bearer de produção commitado
// vale para qualquer um que leia o repositório — foi o que aconteceu, e o token que
// estava nesta linha teve de ser revogado. Cole o seu no console uma vez:
//
//   localStorage.setItem('api:token', 'SEU_TOKEN')
//
// Ele sobrevive ao reload e nunca entra no git.
localStorage.setItem('api:base', 'http://localhost:8000');

window.__TAURI__ = {
    core: {
        invoke: async (comando, args) => {
            console.log('invoke', comando, args ?? '');

            // Telas e janelas de mentira: no navegador não existe sistema operacional
            // para perguntar, e o que se quer testar aqui é o seletor.
            const respostas = {
                check_update: null,
                all_settings: [],
                autostart_enabled: false,
                get_setting: null,
                list_displays: [
                    { id: 1, width: 3456, height: 2234 },
                    { id: 2, width: 1920, height: 1080 },
                ],
                // 1x1 transparente: prova que a miniatura chega e aparece.
                source_preview: 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7',
                list_windows: [
                    { id: 87, title: 'Arena Breakout', application: 'Steam' },
                    { id: 91, title: 'Terminal', application: 'Terminal' },
                    { id: 92, title: 'Terminal', application: 'Terminal' },
                    { id: 93, title: 'unkvoid — main — 180x50', application: 'Code' },
                    { id: 94, title: 'Um título absurdamente longo de janela que não cabe', application: 'Navegador' },
                    { id: 95, title: 'WhatsApp', application: 'WhatsApp' },
                    { id: 96, title: 'Spotify', application: 'Spotify' },
                    { id: 99, title: '', application: 'Dock' },
                ],
            };

            return comando in respostas ? respostas[comando] : null;
        },
    },
    opener: { openUrl: async url => console.log('openUrl', url) },
    deepLink: { onOpenUrl: () => {} },
    event: { listen: async () => () => {} },
};
</script>
<script type="module">
const html = await (await fetch('./dist/index.html')).text();

document.body.insertAdjacentHTML('beforeend', html.replace(/[\s\S]*<body>/, '').replace(/<\/body>[\s\S]*/, '').replace(/<script[\s\S]*?<\/script>/g, ''));

const folha = document.createElement('link');
folha.rel = 'stylesheet';
folha.href = './dist/' + html.match(/href="\/?(assets\/[^"]*\.css)"/)[1];
document.head.appendChild(folha);

await import('./dist/' + html.match(/src="\/?(assets\/[^"]*\.js)"/)[1]);
</script>
</html>
