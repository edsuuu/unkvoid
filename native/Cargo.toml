[workspace]
resolver = "3"
members = ["shared/capture", "shared/media", "shared/storage", "shared/core", "apps/desktop/src-tauri", "apps/linux", "apps/windows"]

[workspace.package]
version = "0.1.0-beta"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Tirar os símbolos de um proc-macro invalida a assinatura do `.dylib` no macOS, e o rustc
# passa a dizer "can't find crate" no build de release. Isto só vale para o que compila para
# a máquina que builda (proc-macros e build scripts): o binário que sai continua enxuto.
[profile.release.build-override]
strip = false
