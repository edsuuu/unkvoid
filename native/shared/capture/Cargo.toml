[package]
name = "capture"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Screen and system audio capture, native per platform"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "9", features = ["macos_15_0"] }
apple-cf = { version = "0.9", features = ["cv"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = "2"
windows = { version = "0.62", features = [
    "Win32_Graphics_Direct3D11",
    # A área útil do monitor: o tamanho para o qual volta a janela minimizada que estava
    # maximizada.
    "Win32_Graphics_Gdi",
    # O áudio do sistema: laço por processo, para não gravar o que o próprio app toca.
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    # A tela inteira sem o Discord: quem é pai de quem, para achar a árvore dele.
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_Security",
    # Descobrir de qual processo é a janela escolhida, para gravar só o som dele.
    "Win32_UI_WindowsAndMessaging",
] }

# O `#[implement]` gera caminhos `windows_core::`, então a crate precisa estar aqui pelo
# nome dela — o reexport em `windows::core` não serve para o que a macro escreve.
windows-core = "0.62"

# A tela no Wayland: o portal `org.freedesktop.portal.ScreenCast`, por D-Bus puro. Sem a
# feature `pipewire` de propósito: ela exigiria `libpipewire-dev` no build, e quem lê o
# PipeWire aqui é o `pipewiresrc` do `gst-launch`, como o resto da captura.
#
# `async-io`, e não `tokio`: o `zbus` que o Tauri já compila (plugin de instância única)
# está em `async-io`, e o cargo unifica features — pedir `zbus/tokio` daqui trocaria o
# executor do plugin junto, porque o zbus prefere o tokio quando os dois estão ligados.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "screencast"] }
async-io = "2"

[dev-dependencies]
tracing-subscriber.workspace = true
