[package]
name = "core-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "core_app"
path = "src/lib.rs"
# `staticlib` para o Swift e o C# linkarem; `rlib` para o app Linux usar como crate.
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
futures-util = "0.3.34"
# `wss://` com as raízes do webpki: sem TLS o app só falava com o SFU local em `ws://`, e em
# produção nenhuma sala abria.
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
# O provedor de criptografia do `wss://` (ver `client.rs`).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rand = "0.8"
# O mesmo do `src-tauri`: uma entrada só no lock, e TLS sem OpenSSL do sistema.
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls"] }
storage = { path = "../storage" }
# Transmitir é decisão, não desenho: qual origem, qual taxa, quando republicar. Por
# isso captura e mídia entram aqui, e não em cada pasta de sistema.
capture = { path = "../capture" }
media = { path = "../media" }
base64 = "0.22"
# O atualizador: a ordem das versões com `-beta`, e a assinatura do instalador. Os dois já
# estão no lock pelo atualizador do Tauri.
semver = "1"
minisign-verify = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
