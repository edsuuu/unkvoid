# Rede do kernel para o SFU. Vai para /etc/sysctl.d/99-unkvoid.conf e substitui os dois
# arquivos que existem hoje na VPS:
#
#   sudo cp infra/sysctl-unkvoid.conf /etc/sysctl.d/99-unkvoid.conf
#   sudo rm /etc/sysctl.d/99-unkvoid-udp.conf   # virou este arquivo
#   sudo rm /etc/sysctl.d/99-livekit.conf       # sobrou de um teste de LiveKit
#   sudo sysctl --system
#
# Cada número aqui saiu de medição nesta máquina, e o comentário diz qual.

# ---------------------------------------------------------------------------------------
# Buffer de RECEPÇÃO do UDP — o que entra: o RTP puro de quem transmite.
#
# O padrão do Ubuntu é 208 KB e o mediasoup não chama setsockopt para o socket dele, então
# cada transporte plain herda esse valor. Uma transmissão 1440p60 a 16 Mb/s chega em
# rajadas de quadro que estouram isso: o socket 41007 acumulou 5738 pacotes descartados.
# 4 MB é teto, não reserva — em operação saudável a fila fica em zero.
net.core.rmem_default = 4194304

# O máximo estava em 5 MB (do arquivo do LiveKit), a um passo do default de 4 MB: quem
# pedisse mais era cortado sem avisar. 16 MB dá espaço para subir o default se voltar a
# haver descarte, contra o teto de 1,43 GB que o próprio kernel impõe ao UDP.
net.core.rmem_max = 16777216

# ---------------------------------------------------------------------------------------
# Buffer de ENVIO do UDP — o que sai: a mesma transmissão replicada para cada espectador.
#
# É o defeito espelhado do de cima, e ainda está aberto: `grep ^Udp: /proc/net/snmp` nesta
# máquina marca 30094 SndbufErrors. O mediasoup também não chama setsockopt no envio, e o
# SFU manda N vezes o que recebe — um quadro-chave de 1080p60 para 17 espectadores sai
# como uma rajada de ~180 pacotes de uma vez, muito acima dos 208 KB do padrão.
net.core.wmem_default = 4194304
net.core.wmem_max = 16777216

# ---------------------------------------------------------------------------------------
# A fila entre a placa de rede e o kernel. 1000 é o padrão e é dimensionado para tráfego
# de página, não para rajada de quadro: 4 transmissões 1440p60 chegando juntas passam
# disso em milissegundos, e o que não couber é descartado antes de qualquer socket.
net.core.netdev_max_backlog = 4096

# A fila de conexões TCP aceitas (nginx, /sfu, /app). 4096 já estava aplicado à mão nesta
# máquina; fica aqui para não se perder no próximo servidor.
net.core.somaxconn = 4096

# ---------------------------------------------------------------------------------------
# AS PORTAS FIXAS DO SFU NÃO PODEM SER SORTEADAS PARA OUTRA COISA.
#
# `net.ipv4.ip_local_port_range` nesta máquina é 32768-60999, e as portas do mediasoup
# (40000-40006 do WebRTC, 41000-41447 do RTP puro) estão DENTRO dessa faixa. Qualquer
# conexão de saída — o curl do deploy, o runner do GitHub, o webhook para o Laravel —
# pode receber uma delas como porta de origem efêmera. Quando isso acontece, o mediasoup
# sorteia, encontra ocupada, e devolve `no more available ports` num horário aleatório.
#
# Reservar 1008 portas de um universo de 28231 não custa nada, e fecha a única forma de o
# erro "não tem porta" voltar depois de SFU_PLAIN_PORTS estar certo. A faixa é a do
# firewall (41000-42000), não a de hoje, para valer também quando SFU_PLAIN_PORTS subir.
net.ipv4.ip_local_reserved_ports = 40000-40006,41000-42000

# ---------------------------------------------------------------------------------------
# A máquina compila Rust nela mesma pelo runner do GitHub, e swap entra mesmo com 24 GB:
# o que decide é a FORMA do pico, não o tamanho da RAM. Sem swap, um pico de build faz o
# OOM killer escolher uma vítima — e a vítima mais gorda é um worker do mediasoup, no
# meio de uma transmissão. 10 é "só use se faltar de verdade".
#
# O arquivo de swap não é criado por sysctl; é uma vez só, na VPS:
#   sudo fallocate -l 4G /swapfile && sudo chmod 600 /swapfile
#   sudo mkswap /swapfile && sudo swapon /swapfile
#   echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
vm.swappiness = 10

# ---------------------------------------------------------------------------------------
# O que foi medido e NÃO muda:
#
# net.netfilter.nf_conntrack_max = 262144, com nf_conntrack_count em 21. Cada pessoa na
#   sala gasta uma ou duas entradas, então o teto está três ordens de grandeza longe de
#   ser o gargalo. Mexer nele só gastaria RAM.
# net.core.default_qdisc = fq_codel, já ativo em eth0. É fila por fluxo: a rajada de um
#   espectador não derruba o pacote do outro. Trocar por `fq` não acrescenta pacing para
#   UDP, que é o que faltaria.
# net.ipv4.somaxconn/tcp_max_syn_backlog = 512 no syn_backlog. Não é o gargalo: o teto de
#   conexões desta máquina é o `worker_connections` do nginx, muito antes da fila de SYN.
