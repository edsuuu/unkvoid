# unkvoid.com — o site, a API, e a sinalização do SFU. Vai para
# /etc/nginx/sites-available/unkvoid, e o certbot acrescenta o TLS:
#   sudo certbot --nginx -d unkvoid.com -d www.unkvoid.com -d s3.unkvoid.com -d mail.unkvoid.com
#
# Depois do certbot, acrescente `http2` na linha que ele escreveu — este nginx é 1.24, onde
# a diretiva `http2 on;` ainda não existe e o HTTP/2 mora no `listen`:
#   listen 443 ssl http2;   # era `listen 443 ssl;`
# Vale por causa da rajada de assets do Livewire: uma conexão multiplexada em vez de seis.
#
# A mídia NÃO passa por aqui: vai direto por UDP nas portas 40000-40006 (WebRTC de quem
# assiste) e 41000-41447 (RTP puro de quem transmite pelo app, e de quem assiste no Linux).

# "upgrade" só quando o cliente pediu WebSocket; numa requisição comum vira "close".
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.unkvoid.com;
    return 301 https://unkvoid.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name unkvoid.com;

    root /var/www/projects/unkvoid-web/current/public;
    index index.php;
    charset utf-8;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # Instalador do Windows sobe pelo painel: cabe em 200 MB com folga.
    #
    # O PHP precisa concordar, e hoje não concorda: `upload_max_filesize = 2M` e
    # `post_max_size = 8M` no php.ini fazem o envio morrer DEPOIS de subir os 200 MB, com
    # erro do PHP e não do nginx. Os valores estão no SERVIDOR.md.
    client_max_body_size 200m;

    # O nginx só termina TLS. Quem responde é o Node, e ele precisa do IP de verdade:
    # o teto de conexões por IP é o que segura varredura, e sem o cabeçalho todo mundo
    # viraria o mesmo cliente 127.0.0.1.
    location /sfu {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    # Reverb (o chat e a presença): o WebSocket dos clientes em /app/{chave} e o POST do
    # próprio Laravel publicando em /apps/{id}/events. Sem este bloco os dois caem no
    # index.php e voltam 404 em silêncio. O Reverb escuta só em 127.0.0.1:8080.
    #
    # Aplicado na VPS em 16/09/2026, junto com o `map $http_upgrade` em
    # /etc/nginx/conf.d/upgrade.conf. O `filebrowser`, que ocupava a 8080, foi desligado
    # no mesmo dia — sem isso o chat do Unkvoid ia parar nele e o Reverb nem subia.
    location ~ ^/apps?/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        # O app Tauri consulta este endpoint a partir de uma origem local.
        add_header Access-Control-Allow-Origin "*" always;
    }

    # O repositório APT mora num bucket público do MinIO. O apt só precisa de GET.
    #
    # `limit_rate` porque o download e a mídia disputam o MESMO uplink, e o uplink é o teto
    # desta máquina (ver SERVIDOR.md). Um `apt upgrade` sem limite leva os 25 MB/s da
    # placa e a transmissão de quem está ao vivo perde pacote. 2 MB/s traz um .deb de
    # 26 MB em 13 s e deixa 9/10 da banda para quem está assistindo.
    location /apt/ {
        proxy_pass http://127.0.0.1:9000/apt/;
        proxy_set_header Host $host;
        limit_rate 2m;
    }

    # O Vite carimba o hash do conteúdo no nome, então o arquivo nunca muda de conteúdo
    # sem mudar de nome: `immutable` faz o navegador nem perguntar. É o que tira a maior
    # parte dos bytes estáticos do caminho do php-fpm, que só tem 16 slots.
    location ~ ^/build/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# O MinIO, para as URLs assinadas de download. O Host precisa chegar intacto: a
# assinatura foi calculada com ele.
server {
    listen 80;
    listen [::]:80;
    server_name s3.unkvoid.com;

    client_max_body_size 0;
    ignore_invalid_headers off;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300;
        chunked_transfer_encoding off;

        # Mesmo motivo do /apt/: é por aqui que sai o instalador de ~100 MB, e o dia de
        # publicar uma versão é justamente o dia em que muita gente baixa junto. 3 MB/s
        # entrega em ~35 s sem tirar a banda de quem está numa sala.
        limit_rate 3m;
    }
}

# Só existe para o certbot provar o domínio do e-mail. O contêiner de e-mail lê o
# certificado direto de /etc/letsencrypt.
server {
    listen 80;
    listen [::]:80;
    server_name mail.unkvoid.com;
    return 404;
}
