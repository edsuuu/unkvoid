# unkvoid.com — o site, a API, e a sinalização do SFU. Vai para
# /etc/nginx/sites-available/unkvoid, e o certbot acrescenta o TLS:
#   sudo certbot --nginx -d unkvoid.com -d www.unkvoid.com -d s3.unkvoid.com -d mail.unkvoid.com
#
# A mídia NÃO passa por aqui: vai direto por UDP nas portas 40000-40003 (WebRTC de quem
# assiste) e 41000-41031 (RTP puro de quem transmite pelo app).

server {
    listen 80;
    listen [::]:80;
    server_name www.unkvoid.com;
    return 301 https://unkvoid.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name unkvoid.com;

    root /var/www/projects/unkvoid-web/current/public;
    index index.php;
    charset utf-8;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # Instalador do Windows sobe pelo painel: cabe em 200 MB com folga.
    client_max_body_size 200m;

    # O nginx só termina TLS. Quem responde é o Node, e ele precisa do IP de verdade:
    # o teto de conexões por IP é o que segura varredura, e sem o cabeçalho todo mundo
    # viraria o mesmo cliente 127.0.0.1.
    location /sfu {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        # O app Tauri consulta este endpoint a partir de uma origem local.
        add_header Access-Control-Allow-Origin "*" always;
    }

    # O repositório APT mora num bucket público do MinIO. O apt só precisa de GET.
    location /apt/ {
        proxy_pass http://127.0.0.1:9000/apt/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# O MinIO, para as URLs assinadas de download. O Host precisa chegar intacto: a
# assinatura foi calculada com ele.
server {
    listen 80;
    listen [::]:80;
    server_name s3.unkvoid.com;

    client_max_body_size 0;
    ignore_invalid_headers off;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300;
        chunked_transfer_encoding off;
    }
}

# Só existe para o certbot provar o domínio do e-mail. O contêiner de e-mail lê o
# certificado direto de /etc/letsencrypt.
server {
    listen 80;
    listen [::]:80;
    server_name mail.unkvoid.com;
    return 404;
}
