# discord.unkvoid.com — o SFU e os instaladores.
#   /sfu        sinalização, WebSocket → 127.0.0.1:3000
#   /health     o app pergunta isto antes de deixar alguém entrar numa sala
#   /downloads  os instaladores gerados aqui mesmo pelo build-vps.sh
#
# A mídia NÃO passa por aqui: vai direto por UDP nas portas 40000-40003 (WebRTC de quem
# assiste) e 41000-41031 (RTP puro de quem transmite pelo app — 8 portas por worker, uma
# por transmissão simultânea).
server {
    server_name discord.unkvoid.com;

    # O nginx só termina TLS. Quem responde é o Node, e ele precisa do IP de verdade:
    # o teto de conexões por IP é a única coisa que segura varredura de códigos de sala,
    # e sem o cabeçalho todo mundo viraria o mesmo cliente 127.0.0.1.
    location /sfu {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    location /health {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        # O app Tauri consulta este endpoint a partir de uma origem local,
        # não da origem do domínio.
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Instaladores gerados nesta máquina. Arquivo estático, servido pelo nginx e não
    # pelo Node: um .deb de dezenas de MB atravessando o processo que faz a sinalização
    # da chamada seria disputar CPU com quem está assistindo agora.
    # Sem isto, /downloads (sem barra) não casa com o location e cai no 404 geral.
    location = /downloads { return 301 /downloads/; }

    location /downloads/ {
        alias /var/www/downloads/unkvoid/;
        autoindex on;
        add_header Cache-Control "no-store" always;
    }

    location / { return 404; }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/discord.unkvoid.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/discord.unkvoid.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = discord.unkvoid.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name discord.unkvoid.com;
    return 404; # managed by Certbot
}
