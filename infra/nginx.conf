# Substitui /etc/nginx/nginx.conf (o contexto global — `worker_*`, `events`, `gzip`). Os
# sites ficam em sites-available/, este arquivo não conhece nenhum deles:
#
#   sudo cp /etc/nginx/nginx.conf /etc/nginx/nginx.conf.bak
#   sudo cp infra/nginx.conf /etc/nginx/nginx.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# É a config da distro com quatro mudanças, cada uma marcada com "MUDOU" e o motivo. O
# resto está aqui só para não se perder ao trocar o arquivo.
#
# (Este arquivo era a config do site discord.unkvoid.com, que hoje é servido pelo mesmo
# bloco de unkvoid.com — ver infra/nginx-unkvoid.conf.)

user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

# MUDOU (não existia). Sem isto o worker do nginx fica com o limite SOFT de 1024
# descritores que ele herda do systemd (`cat /proc/<worker>/limits` mostrava 1024 com teto
# de 524288). Uma conexão proxiada gasta dois descritores — o do cliente e o do upstream —
# então 1024 descritores é ~500 conexões por worker, e subir `worker_connections` sem isto
# é mentira: o nginx aceita e falha no accept.
worker_rlimit_nofile 32768;

events {
    # MUDOU (era 768, o padrão da distro). Cada pessoa no app mantém DUAS conexões longas
    # por aqui: o WebSocket do SFU em /sfu e o do Reverb em /app. Com 768 o teto era
    # 4 × 768 ÷ 2 = ~1500 pessoas, e ele é silencioso: o nginx enfileira e depois derruba.
    # 4096 leva para ~8000 pessoas, que é folga de sobra sobre o teto de banda (58
    # espectadores em 1080p60 numa porta de 600 Mb/s — ver infra/INSTALAR-VPS.md).
    worker_connections 4096;
}

http {
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;
    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # MUDOU (era `TLSv1 TLSv1.1 TLSv1.2 TLSv1.3`). TLS 1.0 e 1.1 não são aceitos por
    # nenhum cliente que o app usa, e cada um é mais um caminho de handshake aberto.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/access.log;

    # MUDOU (não existia, o padrão é 75s). O tráfego real do app é WebSocket, que não
    # depende disto; o que sobra são as rajadas de asset do site. 30s atende a rajada e
    # devolve o slot em menos da metade do tempo.
    keepalive_timeout 30;

    # MUDOU. `gzip on` sozinho comprime SÓ text/html — era o que estava ligado, e o JSON
    # da API, o CSS e o JS do Vite iam inteiros. Nada de binário na lista: .deb, .exe e
    # .dmg já vêm comprimidos, e comprimir de novo gastaria a CPU que é dos workers do
    # mediasoup.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/rss+xml
        application/wasm
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Brotli NÃO entra: este nginx não tem o módulo (`nginx -V` não lista brotli), então
    # custaria um pacote novo numa máquina exposta para ganhar ~15% sobre o gzip em texto.

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
