# Os builds que a VPS não consegue fazer: o .dmg exige um Mac e o .msi exige o WiX no
# Windows. Cada instalador vai direto para o site pela API assinada, que o guarda no
# MinIO e monta o latest.json que o app lê. Ninguém se atualiza pelo GitHub.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: 'Qual sistema publicar'
        type: choice
        default: macos
        options: [macos, windows, ambos]

permissions:
  contents: read

jobs:
  windows:
    # Tag publica os dois; disparo à mão publica só o sistema escolhido. Publicar um
    # instalador que ninguém compilou naquele sistema é o tipo de coisa que só aparece
    # na máquina de quem instalou.
    if: github.event_name == 'push' || inputs.platform != 'macos'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: native/apps/desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run check
      - run: npx tauri build --bundles nsis,msi
        env:
          # Sem a chave o bundle sai sem `.sig`: o instalador funciona e a atualização
          # automática não. É o erro que passou meses sem ninguém notar.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # Antes de publicar, e não depois: o Tauri só avisa quando a chave não bate com a
      # `pubkey` do app, e quem descobre é quem instalou, na hora de atualizar.
      - run: node check-signature.mjs ../../target/release/bundle/msi/*.msi.sig ../../target/release/bundle/nsis/*-setup.exe.sig

      - run: |
          for file in ../../target/release/bundle/msi/*.msi; do ./publish-release.sh windows-x86_64-msi "$file" "$file.sig"; done
          for file in ../../target/release/bundle/nsis/*-setup.exe; do ./publish-release.sh windows-x86_64-nsis "$file" "$file.sig"; done
        env:
          RELEASE_SECRET: ${{ secrets.RELEASE_SECRET }}

  macos:
    if: github.event_name == 'workflow_dispatch' && inputs.platform != 'windows'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: native/apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run check
      - run: npx tauri build --bundles app,dmg
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - run: node check-signature.mjs ../../target/release/bundle/macos/Unkvoid.app.tar.gz.sig

      - run: |
          ./publish-release.sh darwin-aarch64 ../../target/release/bundle/macos/Unkvoid.app.tar.gz ../../target/release/bundle/macos/Unkvoid.app.tar.gz.sig
          for file in ../../target/release/bundle/dmg/*.dmg; do ./publish-release.sh darwin-aarch64-dmg "$file"; done
        env:
          RELEASE_SECRET: ${{ secrets.RELEASE_SECRET }}
