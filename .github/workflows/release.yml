# O instalador do Windows sai de um runner verificável. O fluxo fica pausado até o app único
# terminar a transição; disparado à mão, só publica se o mantenedor pedir explicitamente.
name: release

on:
  # push:
  #   tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publicar o instalador no site'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - run: choco install nsis minisign --no-progress -y

      # A tag é só o gatilho; o aplicativo e os instaladores leem a mesma versão do workspace.
      - if: github.event_name == 'push'
        run: |
          version=$(awk '
            /^\[workspace\.package\]$/ { in_workspace_package = 1; next }
            /^\[/ { in_workspace_package = 0 }
            in_workspace_package && /^version[[:space:]]*=/ {
              value = $0
              sub(/^[^"]*"/, "", value)
              sub(/".*$/, "", value)
              print value
              exit
            }
          ' native/Cargo.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::a tag é $GITHUB_REF_NAME e native/Cargo.toml diz $version"
            exit 1
          fi

      - run: powershell -ExecutionPolicy Bypass -File native/apps/unkvoid/build-installer.ps1
      - name: Assinar o instalador
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.UNKVOID_UPDATE_SECRET_KEY }}
        run: |
          secret_key=$(mktemp)
          trap 'rm -f "$secret_key"' EXIT
          printf '%s' "$MINISIGN_SECRET_KEY" > "$secret_key"
          export UNKVOID_UPDATE_SECRET_KEY="$secret_key"
          for installer in native/target/release/bundle/windows/*-setup.exe; do
            native/release/sign-update.sh "$installer"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: unkvoid
          if-no-files-found: error
          retention-days: 14
          path: |
            native/target/release/bundle/windows/*-setup.exe
            native/target/release/bundle/windows/*-setup.exe.sig

      - if: github.event_name == 'push' || inputs.publish
        env:
          RELEASE_SECRET: ${{ secrets.RELEASE_SECRET }}
        run: |
          for installer in native/target/release/bundle/windows/*-setup.exe; do
            native/release/publish-release.sh windows-x86_64-nsis "$installer" "$installer.sig"
          done
