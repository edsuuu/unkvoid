name: App desktop

# Installers are built only on native runners: .msi requires Windows, .deb requires Linux,
# and .dmg requires macOS. The three cannot be built from a single machine.
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['native/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['native/**']
  workflow_dispatch:

jobs:
  verify:
    name: Verify (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: ubuntu-22.04
            target: linux
          - os: macos-latest
            target: macos
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: System dependencies (Linux)
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Formatting
        working-directory: native
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: native
        # Outside macOS this code has never been executed: treating warnings as errors
        # here would block installers for something we cannot verify locally.
        run: cargo clippy --workspace --all-targets ${{ matrix.target == 'macos' && '-- -D warnings' || '' }}

      - name: Tests
        working-directory: native
        run: cargo test --workspace

  installers:
    name: Installer (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            artifact: msi
          - os: ubuntu-22.04
            target: linux
            artifact: deb
          - os: macos-latest
            target: macos
            artifact: dmg
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: System dependencies (Linux)
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      # Without the signing key, the build fails when generating update artifacts.
      # Disabling them when the secret is missing still lets the installer build —
      # only automatic updates are disabled for that platform.
      - name: Disable update artifacts without a signing key
        if: env.TAURI_SIGNING_PRIVATE_KEY == ''
        shell: bash
        working-directory: native/apps/desktop/src-tauri
        run: |
          python3 - <<'EOF'
          import json, pathlib
          p = pathlib.Path('tauri.conf.json')
          d = json.loads(p.read_text())
          d['bundle']['createUpdaterArtifacts'] = False
          d.get('plugins', {}).pop('updater', None)
          p.write_text(json.dumps(d, indent=2) + '\n')
          print('Updater disabled: TAURI_SIGNING_PRIVATE_KEY is missing from secrets')
          EOF
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Build installer
        working-directory: native/apps/desktop
        run: npm install --no-save @tauri-apps/cli@^2 && npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''

      - uses: actions/upload-artifact@v4
        with:
          name: discord2-${{ matrix.target }}
          path: |
            native/target/release/bundle/msi/*.msi
            native/target/release/bundle/deb/*.deb
            native/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn
          retention-days: 14

      # On a tag, the installer goes directly to the Release — binaries do not enter
      # the repository, otherwise the history grows with every version.
      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            native/target/release/bundle/msi/*.msi
            native/target/release/bundle/deb/*.deb
            native/target/release/bundle/dmg/*.dmg
          draft: false
          prerelease: true
          fail_on_unmatched_files: false
