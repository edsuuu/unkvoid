name: App desktop

# Instaladores só saem em runner nativo: .msi precisa de Windows, .deb de Linux e
# .dmg de macOS. Não dá para gerar os três de uma máquina só.
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['native/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['native/**']
  workflow_dispatch:

jobs:
  verificar:
    name: Verificar (${{ matrix.alvo }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            alvo: windows
          - os: ubuntu-22.04
            alvo: linux
          - os: macos-latest
            alvo: macos
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Dependências do sistema (Linux)
        if: matrix.alvo == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Formatação
        working-directory: native
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: native
        # Fora do macOS o código nunca foi executado: tratar aviso como erro aqui
        # bloquearia o instalador por algo que não temos como verificar localmente.
        run: cargo clippy --workspace --all-targets ${{ matrix.alvo == 'macos' && '-- -D warnings' || '' }}

      - name: Testes
        working-directory: native
        run: cargo test --workspace

  instaladores:
    name: Instalador (${{ matrix.alvo }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            alvo: windows
            artefato: msi
          - os: ubuntu-22.04
            alvo: linux
            artefato: deb
          - os: macos-latest
            alvo: macos
            artefato: dmg
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Dependências do sistema (Linux)
        if: matrix.alvo == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      # Sem a chave de assinatura o build falha ao gerar os artefatos de update.
      # Desligá-los quando o secret não existe deixa o instalador sair mesmo assim —
      # perde-se só a atualização automática naquela plataforma.
      - name: Desligar artefatos de update sem chave
        if: env.TAURI_SIGNING_PRIVATE_KEY == ''
        shell: bash
        working-directory: native/apps/desktop/src-tauri
        run: |
          python3 - <<'EOF'
          import json, pathlib
          p = pathlib.Path('tauri.conf.json')
          d = json.loads(p.read_text())
          d['bundle']['createUpdaterArtifacts'] = False
          d.get('plugins', {}).pop('updater', None)
          p.write_text(json.dumps(d, indent=2) + '\n')
          print('updater desligado: sem TAURI_SIGNING_PRIVATE_KEY nos secrets')
          EOF
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Gerar instalador
        working-directory: native/apps/desktop
        run: npm install --no-save @tauri-apps/cli@^2 && npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''

      - uses: actions/upload-artifact@v4
        with:
          name: discord2-${{ matrix.alvo }}
          path: |
            native/target/release/bundle/msi/*.msi
            native/target/release/bundle/deb/*.deb
            native/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn
          retention-days: 14

      # Em tag, o instalador vai direto para a Release — binário não entra no repo,
      # senão o histórico incha a cada versão.
      - name: Publicar na Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            native/target/release/bundle/msi/*.msi
            native/target/release/bundle/deb/*.deb
            native/target/release/bundle/dmg/*.dmg
          draft: false
          prerelease: true
          fail_on_unmatched_files: false
