name: App desktop

# Installers are built only on native runners: .msi requires Windows, .deb requires Linux,
# and .dmg requires macOS. The three cannot be built from a single machine.
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['native/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['native/**']
  workflow_dispatch:

permissions:
  contents: write

# Um push novo cancela o anterior no mesmo ref. Empurrar tres commits seguidos disparava
# tres rodadas completas em paralelo, e so a ultima interessa. Tags ficam de fora: cada
# uma publica a sua release e nao pode ser cancelada pela seguinte.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ ! startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Em push e PR: só Linux. Minuto de macOS custa 10x e o de Windows 2x, entao a matriz
  # inteira a cada push cobrava ~39 minutos faturados por commit e torrou os 3.000
  # minutos inclusos do mes num dia de trabalho. Linux pega erro de compilacao, teste
  # quebrado e fmt — que e o que muda a cada commit. Os outros dois sistemas continuam
  # rodando onde importa: na tag, antes de gerar instalador.
  verify:
    name: Verify (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && '[{"os":"ubuntu-22.04","target":"linux"},{"os":"windows-latest","target":"windows"},{"os":"macos-latest","target":"macos"}]' || '[{"os":"ubuntu-22.04","target":"linux"}]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: System dependencies (Linux)
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Formatting
        working-directory: native
        run: cargo fmt --all --check

      # Warnings only block on macOS: outside it this code has never been executed, so a
      # lint there should not stop an installer from being produced.
      - name: Clippy
        working-directory: native
        run: cargo clippy --workspace --all-targets ${{ matrix.target == 'macos' && '-- -D warnings' || '' }}

      - name: Tests
        working-directory: native
        run: cargo test --workspace

  # Instalador so em tag (ou a pedido). Sao os jobs caros - macOS custa 10x o minuto e
  # Windows 2x - e o artefato so serve quando ha uma release para receber. Em PR eles
  # rodavam 15 a 19 minutos cada para produzir um .msi que ninguem baixava.
  installers:
    name: Installer (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            artifact: msi
          - os: ubuntu-22.04
            target: linux
            artifact: deb
          - os: macos-latest
            target: macos
            artifact: dmg
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: System dependencies (Linux)
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      # Without the signing key, the build fails when generating update artifacts.
      # Disabling them when the secret is missing still lets the installer build —
      # only automatic updates are disabled for that platform.
      - name: Disable update artifacts without a signing key
        if: env.TAURI_SIGNING_PRIVATE_KEY == ''
        shell: bash
        working-directory: native/apps/desktop/src-tauri
        run: |
          python3 - <<'EOF'
          import json, pathlib
          p = pathlib.Path('tauri.conf.json')
          d = json.loads(p.read_text())
          d['bundle']['createUpdaterArtifacts'] = False
          d.get('plugins', {}).pop('updater', None)
          p.write_text(json.dumps(d, indent=2) + '\n')
          print('Updater disabled: TAURI_SIGNING_PRIVATE_KEY is missing from secrets')
          EOF

      # The UI now goes through Vite (it bundles mediasoup-client and shares the voice
      # code with web/), so the dependencies have to be installed before tauri build —
      # it calls `npm run build` itself as beforeBuildCommand.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/apps/desktop/package-lock.json

      - name: Build installer
        working-directory: native/apps/desktop
        run: |
          npm ci
          npx tauri build

      # Exactly one bundle per platform is signed for the updater (.app.tar.gz on macOS,
      # the installer itself on Windows, the AppImage on Linux). Finding it by its .sig
      # keeps this step honest if Tauri ever renames the artifact. No JSON is built here:
      # this runs on three OSes and only Linux is guaranteed to have python3.
      - name: Collect the updater bundle
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            macos)   key=darwin-aarch64 ;;
            windows) key=windows-x86_64 ;;
            linux)   key=linux-x86_64 ;;
          esac
          sig=$(find native/target/release/bundle -name '*.sig' -print -quit)
          test -n "$sig" || { echo "no signed bundle: is TAURI_SIGNING_PRIVATE_KEY set?" >&2; exit 1; }
          bundle="${sig%.sig}"
          mkdir -p updater/bundle
          cp "$bundle" updater/bundle/
          cp "$sig" "updater/$key.sig"
          basename "$bundle" > "updater/$key.file"

      - uses: actions/upload-artifact@v4
        with:
          name: unkvoid-${{ matrix.target }}
          path: |
            native/target/release/bundle/msi/*.msi
            native/target/release/bundle/deb/*.deb
            native/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: updater-${{ matrix.target }}
          path: updater/
          if-no-files-found: error
          retention-days: 14

      # On a tag, the installer goes directly to the Release — binaries do not enter
      # the repository, otherwise the history grows with every version.
      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            native/target/release/bundle/msi/*.msi
            native/target/release/bundle/deb/*.deb
            native/target/release/bundle/dmg/*.dmg
            updater/bundle/*
          draft: false
          # NÃO marcar como pré-lançamento: o endpoint do auto-update é
          # /releases/latest/download/latest.json, e o "latest" do GitHub IGNORA
          # pré-lançamentos. Com todas marcadas assim, essa URL responde 404 e o app
          # nunca acha atualização nenhuma — foi o que aconteceu da v0.2.0 à v0.7.0.
          prerelease: false
          fail_on_unmatched_files: false

  # The app only updates itself if it finds this manifest, so it is published last:
  # a latest.json pointing at assets that failed to upload would break every client.
  manifest:
    name: Updater manifest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: installers
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: updater-*
          path: updater
          merge-multiple: true

      - name: Compose latest.json
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'EOF'
          import datetime, json, os, pathlib

          tag = os.environ['TAG']
          base = f"https://github.com/{os.environ['REPO']}/releases/download/{tag}"

          # The version the built app reports. A manifest announcing a different one
          # sends every client into an update loop: it installs, still reports the old
          # version, and updates again.
          config = json.loads(pathlib.Path('native/apps/desktop/src-tauri/tauri.conf.json').read_text())
          version = config['version']

          if version != tag.lstrip('v'):
              raise SystemExit(f'tag {tag} does not match the app version {version}')

          platforms = {
              signature.stem: {
                  'signature': signature.read_text().strip(),
                  'url': f"{base}/{signature.with_suffix('.file').read_text().strip()}",
              }
              for signature in sorted(pathlib.Path('updater').glob('*.sig'))
          }

          if not platforms:
              raise SystemExit('no platform was signed — latest.json would be useless')

          pathlib.Path('latest.json').write_text(json.dumps({
              'version': version,
              'notes': f'Unkvoid {tag}',
              'pub_date': datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00', 'Z'),
              'platforms': platforms,
          }, indent=2) + '\n')
          EOF
          cat latest.json

      - uses: softprops/action-gh-release@v2
        with:
          files: latest.json
          draft: false
          prerelease: false
