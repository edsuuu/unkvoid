# O `.deb` nasce na VPS, dentro do Debian 12 do app único, e entra no APT dali. O fluxo
# continua pausado: uma atualização automática no Linux não pode começar sem decisão do dono.
name: build-linux

on:
  # push:
  #   branches: [main]
  #   paths: ['native/**', '.github/workflows/build-linux.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-linux
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'edsuuu/unkvoid' && github.actor == 'edsuuu'
    runs-on: [self-hosted, Linux, X64, unkvoid]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          rsync -a --delete --exclude target --exclude target-deb12 --exclude .cargo-home --exclude .home \
            --exclude node_modules --exclude dist \
            ./native/ /var/www/projects/unkvoid/native/
      - run: /var/www/projects/unkvoid/native/release/build-vps.sh
