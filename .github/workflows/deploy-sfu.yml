# O SFU vai para o ar a cada push na main que toque nele. O restart derruba quem estiver
# em chamada por alguns segundos, e isso é aceito: o deploy sai na hora.
name: deploy-sfu

# PAUSADO junto com o release.yml: nada sobe sozinho até terminarmos. Descomente o `push`
# quando voltar a valer — enquanto isso o deploy sai só pelo disparo à mão.
on:
  # push:
  #   branches: [main]
  #   paths: ['sfu/**', '.github/workflows/deploy-sfu.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-sfu
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'edsuuu/unkvoid' && github.actor == 'edsuuu'
    runs-on: [self-hosted, Linux, X64, unkvoid]
    timeout-minutes: 10
    defaults:
      run:
        working-directory: /var/www/projects/unkvoid/sfu
    steps:
      # Sem checkout e sem rsync: o deploy roda no proprio clone da VPS, que e de onde o
      # pm2 tira o SFU (`cwd: __dirname` no ecosystem). Um diretorio so, nada de copia.
      - run: |
          git fetch --prune origin main
          git reset --hard origin/main
        working-directory: /var/www/projects/unkvoid

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run lint
      - run: ./install.sh
